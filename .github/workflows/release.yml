name: Build and Release Rule-Sets

on:
  workflow_dispatch:
  schedule:
    # 6:45 AM CST (UTC+8) is 22:45 UTC on the previous day
    - cron: "45 22 * * *"
    # 18:15 PM CST (UTC+8) is 10:15 UTC on the same day
    - cron: "15 10 * * *"

jobs:
  build-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed to create releases and push to a branch

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python dependencies
        run: pip install requests

      # 安装 Sing-box 并移动到系统路径，以便 Python 脚本调用
      - name: Setup Sing-box
        run: |
          echo "Downloading Sing-box..."
          LATEST_URL=$(curl -sL "https://api.github.com/repos/SagerNet/sing-box/releases/latest" | grep "browser_download_url" | grep "linux-amd64.tar.gz" | head -n 1 | cut -d '"' -f 4)
          curl -L -o sing-box.tar.gz "$LATEST_URL"
          tar -xzf sing-box.tar.gz
          # 查找解压出的目录（通常包含版本号）
          DIR_NAME=$(find . -maxdepth 1 -type d -name "sing-box*linux*")
          sudo mv "$DIR_NAME/sing-box" /usr/local/bin/
          rm -rf sing-box.tar.gz "$DIR_NAME"
          echo "Sing-box version:"
          sing-box version

      # 安装 Mihomo 并移动到系统路径，以便 Python 脚本调用
      - name: Setup Mihomo
        run: |
          echo "Downloading Mihomo..."
          # 获取最新的 linux-amd64 版本 (排除 alpha/beta，通常 latest 接口返回稳定版)
          LATEST_URL=$(curl -sL "https://api.github.com/repos/MetaCubeX/mihomo/releases/latest" | grep "browser_download_url" | grep "linux-amd64-v" | grep ".gz" | head -n 1 | cut -d '"' -f 4)
          curl -L -o mihomo.gz "$LATEST_URL"
          gunzip mihomo.gz
          chmod +x mihomo
          sudo mv mihomo /usr/local/bin/
          echo "Mihomo version:"
          mihomo -v

      # 运行 Python 脚本，它会自动检测上述工具并生成 json, srs, mrs
      - name: Run converter script
        run: python convert.py

      # 将 dist 目录下的所有文件部署到 release 分支（作为静态文件托管）
      - name: 🚀 Deploy to release branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: release
          force_orphan: true
          commit_message: "Update rule-sets (${{ github.sha }}) [ci skip]"

      - name: Set Release Tag
        id: set_vars
        run: |
          TIMESTAMP=$(date +%s)
          echo "RELEASE_TAG=$TIMESTAMP" >> $GITHUB_ENV

      # 创建 Release 并上传三种格式的文件
      - name: 📦 Create New GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/*.json
            dist/*.srs
            dist/*.mrs
